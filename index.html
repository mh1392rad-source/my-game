<style>

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#eef1ff;--bg2:#dfe6ff;--bg3:#f6e9ff;--tx:#1a1a2e;--mut:#555a70;--card:rgba(255,255,255,.75);--bd:rgba(26,26,46,.15);--gold:#b8860b;--shade:rgba(255,255,255,.7);color-scheme:light}}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;background-color:var(--bg1);background-image:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-attachment:fixed;color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:10px}
.app{width:100%;max-width:560px;position:relative}
.row{display:flex;gap:6px;align-items:center}
.hd{justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:1.25rem;background:linear-gradient(45deg,#f7971e,#ffd200);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bdg{padding:3px 10px;border-radius:14px;font-size:.72rem;font-weight:700;background:linear-gradient(45deg,#f7971e,#ffd200);color:var(--dk)}

.lv button.lk{opacity:.45}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--shade);padding:7px;border-radius:12px;text-align:center}

.op button:hover:not(:disabled){transform:scale(1.03)}
.op button:disabled{cursor:default}.op button.h{opacity:.15}
.op button.c{background:var(--ok);border-color:var(--ok);color:#fff}.op button.w{background:var(--bad);border-color:var(--bad);color:#fff;animation:sh .3s}

.btn{border:0;border-radius:10px;padding:10px 4px;font:inherit;font-weight:700;font-size:.8rem;cursor:pointer;color:#fff}

.go{width:100%;font-size:1rem;padding:13px;background:linear-gradient(45deg,#00b894,#00cec9)}
.t1{background:linear-gradient(45deg,#6c5ce7,#a29bfe)}.t2{background:linear-gradient(45deg,#fdcb6e,#f39c12);color:var(--dk)}.t3{background:linear-gradient(45deg,#e84393,#fd79a8)}
.msg{margin-top:8px;min-height:38px;padding:8px;text-align:center;font-size:.82rem;background:var(--shade);border-radius:10px}
.ft{margin-top:14px;padding:10px;text-align:center;font-size:.72rem;color:var(--mut);background:var(--shade);border-radius:12px}
.ft strong{color:var(--gold)}.ft a{display:inline-block;margin-top:5px;padding:5px 16px;border-radius:20px;border:2px solid rgba(0,210,211,.35);color:#00a8a9;text-decoration:none;font-weight:700}
.fl{position:fixed;pointer-events:none;font-weight:700;color:var(--gold);animation:up 1s forwards;z-index:30}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.md.on{display:flex}
.bx{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:16px;width:100%;max-width:430px;max-height:85vh;overflow:auto}
.bx h2{font-size:1.05rem;color:var(--gold);margin-bottom:10px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;margin:5px 0;background:var(--card);border-radius:10px;font-size:.82rem}
.it small{display:block;color:var(--mut);font-size:.68rem}
.bx .btn{padding:7px 12px}.cl{width:100%;margin-top:10px;background:var(--vi)}
.tt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dk);padding:8px 16px;border-radius:20px;font-weight:700;font-size:.8rem;z-index:60;display:none}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--shade);padding:7px;border-radius:12px;margin:6px 0;text-align:center}.stg b{display:block;font-size:.9rem;color:var(--gold)}.stg span{font-size:.55rem;color:var(--mut)}.ch{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin:6px 0;background:var(--shade);padding:6px;border-radius:10px;font-size:.68rem}.ch div{display:flex;justify-content:space-between;padding:3px 6px;background:var(--card);border-radius:6px}.ch b{color:var(--ok)}.tl .btn{font-size:.66rem;padding:9px 2px}.pt{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:up 1s forwards;z-index:30}#bg{position:fixed;inset:0;pointer-events:none;z-index:0}#bg i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.3;animation:fl2 8s infinite}@keyframes fl2{50%{transform:translateY(-80px);opacity:.8}}.app{z-index:1}:root[data-theme="light"]{--bg1:#eef1ff;--bg2:#dfe6ff;--bg3:#f6e9ff;--tx:#1a1a2e;--mut:#555a70;--card:rgba(255,255,255,.75);--bd:rgba(26,26,46,.15);--gold:#b8860b;--shade:rgba(255,255,255,.7);color-scheme:light}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div><div class="app">
 <div class="row hd"><h1>🚀 Math Game Ultimate</h1><div class="row" style="flex-wrap:wrap"><span class="bdg v" id="rk"></span><span class="bdg" id="lb"></span><span class="bdg" id="sb">🔥 ۰</span><span class="bdg" id="cn"></span></div></div>
 <div class="bar" title="تجربه"><i id="xb"></i></div>

  <button data-m="p"><b>👤</b>پروفایل</button><button data-m="s"><b>🛒</b>فروشگاه</button><button data-m="d"><b>🎯</b>مأموریت</button><button id="sn"><b>🔊</b>صدا</button><button id="mu"><b>🎵</b>موسیقی</button><button id="shr"><b>📤</b>اشتراک</button><button id="th"><b>🌓</b>تم</button><button id="rsb"><b>🔄</b>ریست</button><button data-m="f"><b>❤️</b>علاقه‌مندی</button><button id="du2"><b>🤖</b>دوئل</button><button id="ai"><b>🧠</b>معلم</button><button id="lg"></button><button id="rl"><b>🔁</b>بارگذاری</button><button data-m="h"><b>❓</b>راهنما</button>
 </div>

 <div class="stg" id="stg"></div><div class="bar"><i id="tb" style="width:100%"></i></div>
 <div class="q"><small><span id="qn">#۰</span><span id="pw"></span><span id="qs">⏱ ۰</span><span id="du"></span></small><button id="fv" aria-label="علاقه‌مندی" style="position:absolute;top:22px;inset-inline-end:8px;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--gold)">☆</button><span id="qt">آماده‌ای؟</span><div class="bar"><i id="qb" style="width:100%"></i></div></div>
 <div class="op" id="op"></div>
 <div class="tl"><button class="btn t1" id="b5">✂️ ۵۰/۵۰ (۲)</button><button class="btn t2" id="bk">⏭ رد (۲)</button><button class="btn" id="bh" style="background:linear-gradient(45deg,#0984e3,#74b9ff)">💡 راهنما (۳)</button><button class="btn t3" id="bp">⚡ ×۲ (۲۵🪙)</button></div>
 <div class="ch" id="ch"></div><div class="row"><button class="btn go" id="go">▶ شروع بازی</button><button class="btn t3" id="en" aria-label="پایان بازی" style="flex:0 0 auto;padding:13px 16px;font-size:1rem">⏹</button></div>
 <div class="msg" id="ms" aria-live="polite">سطح را انتخاب کن و شروع کن. کلیدهای ۱ تا ۴ هم کار می‌کنند.</div>

</div>

<script>
const $=s=>document.querySelector(s);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace('.','٫').replace('-','−');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const today=()=>new Date().toDateString();
let S;
try{S=JSON.parse(localStorage.getItem('mgu')||'{}')}catch(e){S={}}
S=Object.assign({coins:0,xp:0,lvl:1,up:{t:0,l:0,c:0,s:0},best:{},ach:{},tot:0,games:0,snd:1,pts:0,kills:0,dn:0,boss:0,hist:[],theme:'',fav:[],lang:'fa',day:'',dq:0,ds:0,dp:0,dc:0},S);
S.up=Object.assign({t:0,l:0,c:0,s:0},S.up);
if(S.day!==today()){S.day=today();S.dq=S.ds=S.dp=S.dc=S.dn=0}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const save=()=>{try{localStorage.setItem('mgu',JSON.stringify(S))}catch(e){}};
const LV=[
{k:'easy',n:'مبتدی',i:'📐',m:12,t:60,q:9,o:['+','-'],r:1},
{k:'med',n:'متوسط',i:'🔢',m:30,t:55,q:8,o:['+','-','*'],r:2},
{k:'hard',n:'پیشرفته',i:'🧠',m:80,t:50,q:8,o:['+','-','*','/'],r:4},
{k:'exp',n:'استاد',i:'👑',m:150,t:45,q:7,o:['+','-','*','/','^'],r:6},
{k:'mix',n:'ترکیبی',i:'🎯',m:100,t:45,q:7,o:['+','-','*','/','^','√'],r:8},
{k:'nm',n:'کابوس',i:'💀',m:200,t:40,q:6,o:['*','/','^','√','log','!'],r:10},
{k:'hl',n:'جهنم',i:'🔥',m:300,t:35,q:6,o:['^','√','log','!','sin','cos'],r:12},
{k:'god',n:'خدایی',i:'⚡',m:500,t:30,q:5,o:['^','√','log','!','sin','cos','tan','cot'],r:15}];
const RK=['🥉 تازه‌کار','🥈 کوشا','🥇 حرفه‌ای','💎 استاد','👑 افسانه'];
const TR={sin:{0:0,30:.5,45:.71,60:.87,90:1},cos:{0:1,30:.87,45:.71,60:.5,90:0},tan:{0:0,30:.58,45:1,60:1.73},cot:{30:1.73,45:1,60:.58}};
const POOL=[0,.5,.58,.71,.87,1,1.41,1.73,2];
const ACH=[
['a1','🌱 اولین پاسخ درست',()=>S.tot>=1],['a2','🔥 زنجیره ۱۰',()=>G.best>=10],['a3','💯 ۱۰۰ پاسخ درست',()=>S.tot>=100],
['a7','👹 شکست غول',()=>S.boss>=1],['a4','⭐ رسیدن به سطح ۵',()=>S.lvl>=5],['a5','🛡 ۲۰ سوال بدون خطا',()=>G.ok>=20&&G.bad===0],['a6','🪙 ۵۰۰ سکه',()=>S.coins>=500]];
let cur=0,G={on:0},tick=null,lock=0,audio=null;
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)}
function msg(t){$('#ms').textContent=t}
function beep(f,d=.12,ty='sine'){if(!S.snd)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function rankOf(){return RK[Math.min(RK.length-1,Math.floor(S.lvl/4))]}
function ui(){
 $('#rk').textContent=rankOf()+' • سطح '+fa(S.lvl);$('#cn').textContent='🪙 '+fa(S.coins);ui2();
 $('#xb').style.width=Math.min(100,S.xp/(S.lvl*40)*100)+'%';
 $('#sn').innerHTML='<b>'+(S.snd?'🔊':'🔇')+'</b>صدا';
 $('#lv').innerHTML=LV.map((l,i)=>`<button class="${i===cur?'on':''} ${l.r>S.lvl?'lk':''}" data-i="${i}">${l.r>S.lvl?'🔒':l.i} ${l.n}${l.r>S.lvl?'<br>سطح '+fa(l.r):S.best[l.k]?'<br>'+(S.best[l.k]>=400?'🥇':S.best[l.k]>=200?'🥈':'🥉')+fa(S.best[l.k]):''}</button>`).join('');
 if(G.on){$('#sc').textContent=fa(G.score);$('#st').textContent=fa(G.streak);$('#li').textContent='❤️'.repeat(Math.max(0,G.lives))||'💔';
  $('#pw').textContent=G.pow>0?'⚡ ×۲ '+fa(Math.ceil(G.pow)):'';
  $('#b5').textContent='✂️ ۵۰/۵۰ ('+fa(G.f5)+')';$('#bk').textContent='⏭ رد ('+fa(G.sk)+')';$('#bh').textContent='💡 راهنما ('+fa(G.h)+')'}
}
function distract(a,n){
 const s=new Set([a]);
 if(!Number.isInteger(a)){POOL.sort(()=>Math.random()-.5).forEach(v=>{if(s.size<n&&v!==a)s.add(v)});return[...s]}
 const sp=Math.max(3,Math.ceil(Math.abs(a)*.25));let g=0;
 while(s.size<n&&g++<200){const c=a+rnd(1,sp)*(Math.random()<.5?-1:1);if(c>=0||a<0)s.add(c)}
 let k=1;while(s.size<n)s.add(a+k++);
 return[...s]}
function gen(L){
 const o=pick(L.o);let a,b,r,t;
 if(o==='+'){a=rnd(1,L.m);b=rnd(1,L.m);r=a+b;t=`${a} + ${b}`}
 else if(o==='-'){a=rnd(1,L.m);b=rnd(1,L.m);if(a<b)[a,b]=[b,a];r=a-b;t=`${a} − ${b}`}
 else if(o==='*'){const l=L.m>60?15:L.m>20?10:6;a=rnd(2,l);b=rnd(2,l);r=a*b;t=`${a} × ${b}`}
 else if(o==='/'){b=rnd(2,L.m>60?12:6);r=rnd(2,L.m>60?12:6);a=b*r;t=`${a} ÷ ${b}`}
 else if(o==='^'){a=rnd(2,L.m>150?9:5);b=rnd(2,a>5?2:3);r=a**b;t=`${a}<sup>${b}</sup>`}
 else if(o==='√'){r=rnd(2,L.m>150?20:12);a=r*r;t=`√${a}`}
 else if(o==='log'){b=rnd(2,5);r=rnd(1,4);a=b**r;t=`log<sub>${b}</sub>(${a})`}
 else if(o==='!'){a=rnd(2,L.m>250?7:5);r=1;for(let i=2;i<=a;i++)r*=i;t=`${a}!`}
 else{a=pick(Object.keys(TR[o]).map(Number));r=TR[o][a];t=`${o}(${a}°)`}
 if('+-*'.includes(o)&&Math.random()<.3){return{t:(a+(o==='*'?' × ':o==='+'?' + ':' − ')+'?').replace(/\d+/g,m=>fa(m)),r:b,e:' = '+fa(r)}}
 return{t:t.replace(/\d+/g,m=>fa(m)).replace(/log|sin|cos|tan|cot/g,m=>m),r}}
function next(){
 const L=LV[cur];const q=(G.fm&&S.fav.length)?pick(S.fav):gen(L);G.cq=q;G.ans=q.r;G.n++;G.boss=G.n%10===0;G.gold=!G.boss&&Math.random()<.12;G.ql=G.qm=L.q;lock=0;
 $('#qt').innerHTML=q.t+(q.e||' = ?');G.qh=$('#qt').innerHTML;starUp();robotPlan();$('#qn').textContent=(G.gold?'🌟 طلایی ×۳ سکه ':'')+'#'+fa(G.n)+(G.boss?' 👹 غول ×۳':'');
 const ops=distract(q.r,4).sort(()=>Math.random()-.5);
 $('#op').innerHTML=ops.map((v,i)=>`<button data-v="${v}" aria-label="گزینه ${i+1}">${fa(v)}</button>`).join('');
 [...$('#op').children].forEach(b=>b.disabled=false)}
function start(){
 if(G.on)return;const L=LV[cur];if(L.r>S.lvl){toast('🔒 این سطح هنوز قفل است');return}
 const tot=L.t+S.up.t*3;
 G={on:1,score:0,ok:0,bad:0,streak:0,best:0,lives:3+S.up.l,time:tot,tot,n:0,f5:2,sk:2,h:3,fm:favMode,d:duelMode,rl:duelRl,ps:0,rs:0,pow:0,ql:0,qm:1,coins:0};
 $('#go').textContent='⏳ در حال بازی… (توقف)';
 ['#b5','#bk','#bp','#bh'].forEach(s=>$(s).disabled=false);
 msg('🎯 شروع شد! موفق باشی');favMode=0;if(G.d){G.time=G.tot=999;G.lives=3}duelMode=0;next();ui();
 clearInterval(tick);tick=setInterval(loop,100)}
function loop(){
 G.time-=.1;if(G.pow>0)G.pow-=.1;if(!lock)G.ql-=.1;
 $('#tm').textContent=fa(Math.max(0,Math.ceil(G.time)));
 $('#tb').style.width=Math.max(0,G.time/G.tot*100)+'%';
 $('#qb').style.width=Math.max(0,G.ql/G.qm*100)+'%';$('#qs').textContent='⏱ '+fa(Math.max(0,Math.ceil(G.ql)));
 $('#pw').textContent=G.pow>0?'⚡ ×۲ '+fa(Math.ceil(G.pow)):'';
 if(G.time<=0){end('⏰ زمان تمام شد!');return}
 if(G.ql<=0&&!lock)answer(null)}
function answer(btn){
 if(!G.on||lock)return;lock=1;clearTimeout(G.rt);
 const bs=[...$('#op').children];bs.forEach(b=>b.disabled=true);
 const ok=btn&&Math.abs(parseFloat(btn.dataset.v)-G.ans)<.001;
 if(ok){
  G.streak++;G.ok++;S.tot++;S.kills++;if(G.d)G.ps++;if(G.boss)S.boss=(S.boss||0)+1;G.best=Math.max(G.best,G.streak);
  const pts=Math.round((10+Math.min(G.streak,15)*2)*(G.pow>0?2:1)*(G.boss?3:1)*(1+S.up.s*.1));
